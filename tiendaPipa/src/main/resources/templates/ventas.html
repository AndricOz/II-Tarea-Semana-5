<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ventas — Tienda Pipa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Segoe UI", sans-serif; background: #f0f2f5; }
        main { max-width: 980px; margin: 36px auto; padding: 0 20px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #1a1a2e; }
        .btn { display: inline-block; padding: 9px 18px; background: #4a6cf7; color: white;
               text-decoration: none; border-radius: 6px; font-size: 0.88rem; font-weight: 600; }
        .btn:hover { background: #3a5ce4; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        table { width: 100%; border-collapse: collapse; background: white;
                border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
        th { background: #1a1a2e; color: white; padding: 12px 16px; text-align: left; font-size: 0.85rem; }
        td { padding: 11px 16px; border-bottom: 1px solid #f0f2f5; font-size: 0.9rem; color: #333; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8f9ff; }
        .badge-activo   { color: #155724; background: #d4edda; padding: 2px 8px; border-radius: 12px; font-size: 0.78rem; }
        .badge-inactivo { color: #721c24; background: #f8d7da; padding: 2px 8px; border-radius: 12px; font-size: 0.78rem; }
        .empty { text-align: center; padding: 40px; color: #adb5bd; }
        .acciones { display: flex; gap: 6px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
    <div class="header-row">
        <h2>Ventas</h2>
        <a th:href="@{/tienda/ventas/nuevo}" class="btn">+ Nueva Venta</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Fecha</th>
                <th>Total</th>
                <th>Cliente ID</th>
                <th>Usuario ID</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(venta)}">
                <td colspan="7" class="empty">No hay ventas registradas.</td>
            </tr>
            <tr th:each="v : ${venta}">
                <td th:text="${v.codigoVenta}"></td>
                <td th:text="${v.fechaVenta}"></td>
                <td th:text="'Q ' + ${#numbers.formatDecimal(v.total, 1, 2)}"></td>
                <td th:text="${v.clientesDpiCliente}"></td>
                <td th:text="${v.usuariosCodigoUsuario}"></td>
                <td>
                    <span th:if="${v.estado}" class="badge-activo">Activo</span>
                    <span th:unless="${v.estado}" class="badge-inactivo">Inactivo</span>
                </td>
                <td>
                    <div class="acciones">
                        <a th:href="@{/tienda/ventas/editar/{id}(id=${v.codigoVenta})}" class="btn">Editar</a>
                        <a th:href="@{/tienda/ventas/eliminar/{id}(id=${v.codigoVenta})}" class="btn btn-danger"
                           onclick="return confirm('¿Eliminar esta venta?')">Eliminar</a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
