<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Pipa - Iniciar Sesión</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 0.3rem;
            font-size: 1.6rem;
        }
        .login-card p.subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 1.8rem;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 0.4rem;
            color: #333;
            font-size: 0.9rem;
            font-weight: 500;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            outline: none;
        }
        input:focus { border-color: #4a6cf7; }
        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #3a5ce4; }
        .alerta {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.2rem;
            font-size: 0.88rem;
        }
        .alerta-error { background: #fdecea; color: #c0392b; border: 1px solid #f1aaa5; }
        .alerta-info  { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .hint {
            margin-top: 1.2rem;
            text-align: center;
            font-size: 0.82rem;
            color: #999;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h2>Tienda Pipa</h2>
    <p class="subtitulo">Ingresa con tu usuario o correo electrónico</p>

    <div th:if="${param.error}" class="alerta alerta-error">
        Usuario, correo o contraseña incorrectos. Intente de nuevo.
    </div>

    <div th:if="${param.logout}" class="alerta alerta-info">
        Sesión cerrada correctamente.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Usuario o Correo Electrónico</label>
            <input type="text" id="username" name="username"
                   placeholder="ej: admin o admin@tienda.com" required autofocus />
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password"
                   placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>

    <br><a href="/register">Crear Cuenta</a>

    <p class="hint">Acceso restringido al personal autorizado.</p>
</div>
</body>
</html>
