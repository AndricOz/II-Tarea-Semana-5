<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios — Tienda Pipa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Segoe UI", sans-serif; background: #f0f2f5; }
        main { max-width: 980px; margin: 36px auto; padding: 0 20px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #1a1a2e; }
        .btn { display: inline-block; padding: 9px 18px; background: #4a6cf7; color: white;
               text-decoration: none; border-radius: 6px; font-size: 0.88rem; font-weight: 600; }
        .btn:hover { background: #3a5ce4; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        table { width: 100%; border-collapse: collapse; background: white;
                border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
        th { background: #1a1a2e; color: white; padding: 12px 16px; text-align: left; font-size: 0.85rem; }
        td { padding: 11px 16px; border-bottom: 1px solid #f0f2f5; font-size: 0.9rem; color: #333; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8f9ff; }
        .badge-activo   { color: #155724; background: #d4edda; padding: 2px 8px; border-radius: 12px; font-size: 0.78rem; }
        .badge-inactivo { color: #721c24; background: #f8d7da; padding: 2px 8px; border-radius: 12px; font-size: 0.78rem; }
        .badge-admin { color: #856404; background: #fff3cd; padding: 2px 8px; border-radius: 12px; font-size: 0.78rem; font-weight: 700; }
        .badge-user  { color: #004085; background: #cce5ff; padding: 2px 8px; border-radius: 12px; font-size: 0.78rem; }
        .empty { text-align: center; padding: 40px; color: #adb5bd; }
        .acciones { display: flex; gap: 6px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
    <div class="header-row">
        <h2>👥 Usuarios</h2>
        <a th:href="@{/tienda/usuarios/nuevo}" class="btn">+ Nuevo Usuario</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Username</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(usuario)}">
                <td colspan="6" class="empty">No hay usuarios registrados.</td>
            </tr>
            <tr th:each="u : ${usuario}">
                <td th:text="${u.codigoUsuario}"></td>
                <td th:text="${u.userName}"></td>
                <td th:text="${u.email}"></td>
                <td>
                    <span th:if="${u.rol == 'ADMIN'}" class="badge-admin">ADMIN</span>
                    <span th:unless="${u.rol == 'ADMIN'}" class="badge-user">USER</span>
                </td>
                <td>
                    <span th:if="${u.estado}" class="badge-activo">Activo</span>
                    <span th:unless="${u.estado}" class="badge-inactivo">Inactivo</span>
                </td>
                <td>
                    <div class="acciones">
                        <a th:href="@{/tienda/usuarios/editar/{id}(id=${u.codigoUsuario})}" class="btn">Editar</a>
                        <a th:href="@{/tienda/usuarios/eliminar/{id}(id=${u.codigoUsuario})}" class="btn btn-danger"
                           onclick="return confirm('¿Eliminar este usuario?')">Eliminar</a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
