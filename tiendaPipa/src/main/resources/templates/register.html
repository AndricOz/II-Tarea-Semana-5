<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Pipa - Crear Cuenta</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 0.3rem;
            font-size: 1.6rem;
        }
        .login-card p.subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 1.8rem;
            font-size: 0.9rem;
        }
        .form-group { margin-bottom: 1.2rem; }
        label {
            display: block;
            margin-bottom: 0.4rem;
            color: #333;
            font-size: 0.9rem;
            font-weight: 500;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            outline: none;
        }
        input:focus { border-color: #4a6cf7; }
        input.input-error { border-color: #e74c3c; }
        .error-msg { color: #e74c3c; font-size: 0.8rem; margin-top: 0.3rem; }
        .alerta {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.2rem;
            font-size: 0.88rem;
        }
        .alerta-error { background: #fdecea; color: #c0392b; border: 1px solid #f1aaa5; }
        .btn-login {
            width: 100%;
            padding: 0.85rem;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #3a5ce4; }
        .hint {
            margin-top: 1.2rem;
            text-align: center;
            font-size: 0.82rem;
            color: #999;
        }
        .hint a { color: #4a6cf7; text-decoration: none; }
        .hint a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>Tienda Pipa</h2>
    <p class="subtitulo">Crea tu cuenta para acceder al sistema</p>

    <!-- Error si el email ya está registrado (lanzado desde UsuarioServiceImpl) -->
    <div th:if="${errorEmail}" class="alerta alerta-error">
        <span th:text="${errorEmail}"></span>
    </div>

    <form th:action="@{/guardarRegistro}" th:object="${usuario}" method="post">

        <div class="form-group">
            <label for="userName">Nombre de usuario</label>
            <input type="text" id="userName" th:field="*{userName}"
                   th:classappend="${#fields.hasErrors('userName')} ? 'input-error'"
                   placeholder="ej: juan_perez" autofocus />
            <div th:if="${#fields.hasErrors('userName')}" class="error-msg"
                 th:errors="*{userName}"></div>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'input-error'"
                   placeholder="ej: juan@tienda.com" />
            <div th:if="${#fields.hasErrors('email')}" class="error-msg"
                 th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" th:field="*{password}"
                   th:classappend="${#fields.hasErrors('password')} ? 'input-error'"
                   placeholder="Mínimo 8 caracteres" />
            <div th:if="${#fields.hasErrors('password')}" class="error-msg"
                 th:errors="*{password}"></div>
        </div>

        <button type="submit" class="btn-login">Crear Cuenta</button>
    </form>

    <p class="hint">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
</div>
</body>
</html>
