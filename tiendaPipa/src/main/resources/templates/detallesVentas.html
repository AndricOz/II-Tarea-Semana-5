<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Ventas — Tienda Pipa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Segoe UI", sans-serif; background: #f0f2f5; }
        main { max-width: 980px; margin: 36px auto; padding: 0 20px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #1a1a2e; }
        .btn { display: inline-block; padding: 9px 18px; background: #4a6cf7; color: white;
               text-decoration: none; border-radius: 6px; font-size: 0.88rem; font-weight: 600; }
        .btn:hover { background: #3a5ce4; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        table { width: 100%; border-collapse: collapse; background: white;
                border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
        th { background: #1a1a2e; color: white; padding: 12px 16px; text-align: left; font-size: 0.85rem; }
        td { padding: 11px 16px; border-bottom: 1px solid #f0f2f5; font-size: 0.9rem; color: #333; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8f9ff; }
        .empty { text-align: center; padding: 40px; color: #adb5bd; }
        .acciones { display: flex; gap: 6px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
    <div class="header-row">
        <h2>Detalle de Ventas</h2>
        <a th:href="@{/tienda/detallesVentas/nuevo}" class="btn">Nuevo Detalle</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
                <th>Producto ID</th>
                <th>Venta ID</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(detalleVenta)}">
                <td colspan="6" class="empty">No hay detalles de venta registrados.</td>
            </tr>
            <tr th:each="d : ${detalleVenta}">
                <td th:text="${d.codigoDetalleVenta}"></td>
                <td th:text="${d.cantidad}"></td>
                <td th:text="'Q ' + ${#numbers.formatDecimal(d.subtotal, 1, 2)}"></td>
                <td th:text="${d.productosCodigoProducto}"></td>
                <td th:text="${d.ventasCodigoVenta}"></td>
                <td>
                    <div class="acciones">
                        <a th:href="@{/tienda/detallesVentas/editar/{id}(id=${d.codigoDetalleVenta})}" class="btn">Editar</a>
                        <a th:href="@{/tienda/detallesVentas/eliminar/{id}(id=${d.codigoDetalleVenta})}" class="btn btn-danger"
                           onclick="return confirm('¿Eliminar este detalle?')">Eliminar</a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
