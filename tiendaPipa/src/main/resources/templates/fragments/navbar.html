<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<!-- Al parecer cuando haya algo usable en la mayoria o todos los lugares de la pagina
 debo hacer un pequeño fragmento para no rehacerlo todo el tiempo -->
<header th:fragment="navbar" style="
    font-family:'Segoe UI',sans-serif;
    background:#1a1a2e; color:white;
    padding:14px 28px;
    display:flex; justify-content:space-between; align-items:center;">

    <span style="font-size:1.1rem; font-weight:700;">Tienda Pipa</span>

    <nav style="display:flex; gap:14px; align-items:center; font-size:0.9rem;">


        <a th:href="@{/tienda/productos}" style="color:white; text-decoration:none;">Productos</a>

        <!-- Los links que solo puede meterse el admin -->
        <span sec:authorize="hasRole('ADMIN')" style="display:contents;">
            <a th:href="@{/tienda/clientes}"  style="color:white; text-decoration:none;">Clientes</a>
            <a th:href="@{/tienda/ventas}"    style="color:white; text-decoration:none;">Ventas</a>
            <a th:href="@{/tienda/detallesVentas}"   style="color:white; text-decoration:none;">Detalles</a>
            <a th:href="@{/tienda/usuarios}"  style="color:white; text-decoration:none;">Usuarios</a>
        </span>

        <span sec:authorize="hasRole('ADMIN')"
              style="background:#d4edda;color:#155724;padding:2px 10px;border-radius:20px;font-size:0.75rem;font-weight:700;">
            ADMIN
        </span>
        <span sec:authorize="hasRole('USER')"
              style="background:#cce5ff;color:#004085;padding:2px 10px;border-radius:20px;font-size:0.75rem;font-weight:700;">
            USER
        </span>

        <!-- El boton de logout -->
        <a th:href="@{/logout}" style="background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.35);
                  padding:5px 13px;border-radius:6px;text-decoration:none;font-size:0.82rem;">Salir</a>
    </nav>
</header>

</html>
